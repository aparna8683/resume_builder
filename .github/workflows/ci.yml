name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('node:fs').readFileSync('npm-audit.json','utf8'); const v=JSON.parse(a).vulnerabilities||{}; for (const [name,item] of Object.entries(v)) if (['high','critical'].includes(item.severity)) console.log(name + ': ' + item.severity + ', fixAvailable=' + JSON.stringify(item.fixAvailable));"
      - name: Enforce dependency security threshold
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    name: Backend dependency and syntax checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('node:fs').readFileSync('npm-audit.json','utf8'); const v=JSON.parse(a).vulnerabilities||{}; for (const [name,item] of Object.entries(v)) if (['high','critical'].includes(item.severity)) console.log(name + ': ' + item.severity + ', fixAvailable=' + JSON.stringify(item.fixAvailable));"
      - name: Enforce dependency security threshold
        run: npm audit --audit-level=high
      - name: Run backend tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -path ./node_modules -prune -o -name '*.js' -type f -print)
