name: Patch vulnerable npm dependencies

on:
  push:
    branches: ["fix/production-readiness"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-readiness
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking dependency security fixes
        run: |
          cd client
          npm ci
          npm audit fix
          cd ../server
          npm ci
          npm audit fix
      - name: Commit updated dependency manifests and lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/package-lock.json server/package.json server/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: patch vulnerable npm dependencies"
            git push origin HEAD:fix/production-readiness
          else
            echo "No dependency updates were required."
          fi
      - name: Verify frontend
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Verify backend
        working-directory: server
        run: |
          npm ci
          npm test
          while IFS= read -r file; do node --check "$file"; done < <(find . -path ./node_modules -prune -o -name '*.js' -type f -print)
          npm audit --audit-level=high
